name: OPA policy tests

on:
  push:
    branches:
      - main
    paths:
      - "Terraform/**"
      - ".github/scripts/opa_control_report.py"
      - ".github/workflows/opa-policy-tests.yml"
  pull_request:
    paths:
      - "Terraform/**"
      - ".github/scripts/opa_control_report.py"
      - ".github/workflows/opa-policy-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opa-policy-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPA_VERSION: "0.68.0"
  POLICY_DIR: "Terraform/OPA Policies"

jobs:
  test:
    name: Validate and test OPA policies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OPA
        shell: bash
        run: |
          set -euo pipefail
          asset="opa_linux_amd64_static"
          release_url="https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}"

          curl --fail --location --silent --show-error \
            "${release_url}/${asset}" --output opa
          curl --fail --location --silent --show-error \
            "${release_url}/${asset}.sha256" --output opa.sha256

          sed -i "s#${asset}#opa#" opa.sha256
          sha256sum --check opa.sha256
          chmod +x opa
          sudo install opa /usr/local/bin/opa
          opa version

      - name: Run OPA validation and tests
        id: opa
        shell: bash
        run: |
          set +e

          mapfile -d '' rego_files < <(find "$POLICY_DIR" -type f -name '*.rego' -print0)
          if [[ ${#rego_files[@]} -eq 0 ]]; then
            echo "No Rego files found under $POLICY_DIR" | tee format-results.txt check-results.txt test-results.txt
            format_status=1
            check_status=1
            test_status=1
          else
            opa fmt --fail "${rego_files[@]}" > format-results.txt 2>&1
            format_status=$?

            opa check --strict "${rego_files[@]}" > check-results.txt 2>&1
            check_status=$?

            opa test "${rego_files[@]}" --verbose > test-results.txt 2>&1
            test_status=$?
          fi

          grep 'EXPECTED_DENIAL' test-results.txt > expected-denials.log || true
          grep 'VALID_PLAN' test-results.txt > valid-plan-results.log || true

          {
            echo "OPA version: ${OPA_VERSION}"
            echo
            echo "=== Formatting ==="
            cat format-results.txt
            echo "Exit code: ${format_status}"
            echo
            echo "=== Strict validation ==="
            cat check-results.txt
            echo "Exit code: ${check_status}"
            echo
            echo "=== Unit tests and transparent denial logs ==="
            cat test-results.txt
            echo "Exit code: ${test_status}"
            echo
            echo "=== Expected negative-fixture denials ==="
            cat expected-denials.log
            echo
            echo "=== Valid fixtures ==="
            cat valid-plan-results.log
          } | tee opa-results.txt

          echo "format_status=${format_status}" >> "$GITHUB_OUTPUT"
          echo "check_status=${check_status}" >> "$GITHUB_OUTPUT"
          echo "test_status=${test_status}" >> "$GITHUB_OUTPUT"

      - name: Build control evidence report
        id: evidence
        if: always()
        shell: bash
        run: |
          set +e
          python3 .github/scripts/opa_control_report.py
          evidence_status=$?
          echo "status=${evidence_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Display results in job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## OPA policy test results"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            if [[ "${{ steps.opa.outputs.format_status }}" == "0" ]]; then
              echo "| Rego formatting | Passed |"
            else
              echo "| Rego formatting | Failed |"
            fi
            if [[ "${{ steps.opa.outputs.check_status }}" == "0" ]]; then
              echo "| Strict validation | Passed |"
            else
              echo "| Strict validation | Failed |"
            fi
            if [[ "${{ steps.opa.outputs.test_status }}" == "0" ]]; then
              echo "| Unit tests | Passed |"
            else
              echo "| Unit tests | Failed |"
            fi
            echo
            echo "> **Interpretation:** Observed denials below are expected results from intentionally noncompliant test fixtures. They demonstrate that each policy rejects a bad configuration; they are not violations from a live Terraform plan."
            echo
            cat control-evidence.md
            echo
            echo "<details><summary>Complete OPA output</summary>"
            echo
            echo '```text'
            cat opa-results.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-policy-results
          path: |
            opa-results.txt
            format-results.txt
            check-results.txt
            test-results.txt
            expected-denials.log
            valid-plan-results.log
            control-evidence.md
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow when a check fails
        if: >-
          steps.opa.outputs.format_status != '0' ||
          steps.opa.outputs.check_status != '0' ||
          steps.opa.outputs.test_status != '0' ||
          steps.evidence.outputs.status != '0'
        shell: bash
        run: |
          echo "::error title=OPA policy checks failed::Review the job summary and uploaded results."
          exit 1
